<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Bank</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

.header {
  background: #b51f1f;
  color: white;
  padding: 24px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  border-bottom: 5px solid #8f1515;
}

.container {
  max-width: 440px;
  margin: 60px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 6px;
  border-top: 5px solid #b51f1f;
  box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

h1 {
  text-align: center;
  margin-top: 0;
}

.subtitle {
  text-align: center;
  color: #666;
  line-height: 1.5;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #bbb;
  border-radius: 4px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  border: none;
  border-radius: 4px;
  background: #b51f1f;
  color: white;
  font-size: 17px;
  font-weight: bold;
}

button:active {
  opacity: .85;
}

.hidden {
  display: none;
}

.error {
  color: #b00020;
  text-align: center;
  margin-top: 15px;
}

.code-input {
  text-align: center;
  font-size: 25px;
  letter-spacing: 8px;
}

.dashboard {
  max-width: 900px;
  margin: 35px auto;
  padding: 20px;
}

.balance {
  background: #b51f1f;
  color: white;
  border-radius: 6px;
  padding: 30px;
  margin-bottom: 20px;
}

.balance h2 {
  margin-top: 0;
}

.amount {
  font-size: 38px;
  font-weight: bold;
}

.tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.tile {
  background: white;
  padding: 25px;
  border-radius: 6px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.logout {
  max-width: 220px;
  display: block;
  margin: 25px auto;
}

@media (max-width: 700px) {
  .tiles {
    grid-template-columns: 1fr;
  }

  .container {
    margin: 30px auto;
  }
}
</style>
</head>

<body>

<header class="header">
  Nova Bank
</header>

<!-- SIGN IN -->
<div class="container" id="loginScreen">

  <div class="card">

    <h1>Sign in</h1>

    <p class="subtitle">
      Access your Nova Bank account
    </p>

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="off"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button onclick="continueLogin()">
      Continue
    </button>

    <p id="loginError" class="error"></p>

  </div>

</div>

<!-- VERIFICATION -->
<div class="container hidden" id="verificationScreen">

  <div class="card">

    <h1>Verification</h1>

    <p class="subtitle">
      Enter the 6-digit verification code to continue.
    </p>

    <label>Verification code</label>

    <input
      id="verificationCode"
      class="code-input"
      type="text"
      inputmode="numeric"
      maxlength="6"
      placeholder="000000"
      autocomplete="off"
    >

    <button onclick="verifyCode()">
      Verify
    </button>

    <p id="codeError" class="error"></p>

  </div>

</div>

<!-- DASHBOARD -->
<div class="dashboard hidden" id="dashboardScreen">

  <div class="balance">
    <h2>Welcome to Nova Bank</h2>
    <p>Available balance</p>
    <div class="amount">$25,000.00</div>
  </div>

  <div class="tiles">

    <div class="tile">
      <h3>Checking</h3>
      <p>$18,500.00</p>
    </div>

    <div class="tile">
      <h3>Savings</h3>
      <p>$6,500.00</p>
    </div>

    <div class="tile">
      <h3>Recent activity</h3>
      <p>No recent transactions</p>
    </div>

  </div>

  <button class="logout" onclick="logout()">
    Sign out
  </button>

</div>

<script>

function continueLogin() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value.trim();

  const error =
    document.getElementById("loginError");

  if (!email || !password) {
    error.textContent =
      "Please enter your email and password.";
    return;
  }

  error.textContent = "";

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("verificationScreen")
    .classList.remove("hidden");
}

function verifyCode() {

  const code =
    document.getElementById("verificationCode").value.trim();

  const error =
    document.getElementById("codeError");

  if (code === "123456") {

    error.textContent = "";

    document
      .getElementById("verificationScreen")
      .classList.add("hidden");

    document
      .getElementById("dashboardScreen")
      .classList.remove("hidden");

  } else {

    error.textContent =
      "Incorrect verification code.";

  }
}

function logout() {

  document
    .getElementById("dashboardScreen")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

  document.getElementById("email").value = "";
  document.getElementById("password").value = "";
  document.getElementById("verificationCode").value = "";
}

</script>

</body>
</html>
